# Rebuilds every card and README.md from profile.toml + live GitHub data.
# Runs every day at 00:00 IST, whenever you change the config/template/tools,
# and on demand (Actions tab -> "Build profile" -> Run workflow).
name: Build profile

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - README.template.md
      - tools/**
      - assets/avatar.webp
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build cards and README
        run: python tools/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If any check fails the job stops here and nothing is committed,
      # so your profile keeps showing the last good version.
      - name: Check the generated profile
        run: python tools/check.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md tools/cache
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
