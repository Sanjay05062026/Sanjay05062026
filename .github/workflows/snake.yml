# Draws a snake eating the contribution graph and publishes the SVGs to the
# `output` branch, which README.md links to. Runs daily, on push, or by hand
# (Actions tab -> "Contribution snake" -> Run workflow).
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#151515&color_dots=#e6e4df,#c4c2bc,#8f8d88,#55534f,#151515
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f1f0ed&color_dots=#161b22,#3a3936,#6f6d68,#a8a6a0,#f1f0ed

      # Publish dist/ as the only content of the `output` branch (plain git, no extra action).
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contribution snake"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
