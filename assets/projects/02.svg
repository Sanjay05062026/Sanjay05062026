<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280" role="img">
<title>Project 02: Crowd Management System</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><radialGradient id="cg" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#a78bfa" stop-opacity=".26"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><pattern id="dg" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6edf7" fill-opacity=".07"/></pattern><clipPath id="cf"><rect width="520" height="280" rx="18"/></clipPath><clipPath id="t1"><rect class="tw" x="-84.2" y="28.8" width="112.2" height="19.2" style="transform:translateX(112.2px);animation-duration:0.25s;animation-delay:0.2s;animation-timing-function:steps(11,end)"/></clipPath><clipPath id="t2"><rect class="tw" x="-189.5" y="102.2" width="217.5" height="20" style="transform:translateX(217.5px);animation-duration:0.34s;animation-delay:0.5s;animation-timing-function:steps(29,end)"/></clipPath></defs>
<style>.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif}@keyframes in{from{opacity:0;transform:translateY(10px)}}.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes run{to{stroke-dashoffset:-1000}}.run{animation:run 8s linear infinite}@keyframes rev{from{transform:translateX(0)}}.tw{animation-name:rev;animation-fill-mode:both}@keyframes odo{from{transform:translateY(0)}}.odo{animation:odo 1.8s cubic-bezier(.15,.85,.25,1) both}@keyframes grow{from{transform:scaleX(0)}}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.2)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.3,1.4) both}@keyframes draw{from{stroke-dashoffset:1000}}.draw{stroke-dasharray:1000;animation:draw 2.4s ease-out both}@keyframes fade{from{opacity:0}}.fade{animation:fade 1s ease-out both}@keyframes glo{50%{opacity:.55}}.glo{animation:glo 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".75" y=".75" width="518.5" height="278.5" rx="18" fill="#0a1122" stroke="#1c2740" stroke-width="1.5"/>
<g clip-path="url(#cf)"><rect width="520" height="280" fill="url(#dg)"/><rect class="glo" width="520" height="280" fill="url(#cg)"/></g>
<text x="28" y="42" class="m" font-size="12" fill="#a78bfa" textLength="102" xml:space="preserve" clip-path="url(#t1)">PROJECT_02</text>
<g class="pop" style="animation-delay:0.4s"><rect x="429.2" y="25" width="62.8" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".55"/><text x="440.2" y="41.5" class="m" font-size="11" letter-spacing="1.5" fill="#a78bfa">PYTHON</text></g>
<text x="28" y="90" class="s in" font-size="28" font-weight="800" fill="#e6edf7" style="animation-delay:.5s">Crowd Management System</text>
<text x="28" y="116" class="m" font-size="12.5" fill="#94a3b8" textLength="210" xml:space="preserve" clip-path="url(#t2)">computer vision · operations</text>
<text x="28" y="150" class="s in" font-size="15.5" fill="#aab6cb" style="animation-delay:1s">Venue security console: 2×2 CCTV wall, YOLO head</text>
<text x="28" y="173" class="s in" font-size="15.5" fill="#aab6cb" style="animation-delay:1.1s">counting, crowd-flow prediction, VIP face recognition</text>
<text x="28" y="196" class="s in" font-size="15.5" fill="#aab6cb" style="animation-delay:1.2s">and a fire detector that ignores red objects.</text>
<g class="pop" style="animation-delay:1.4s"><rect x="28" y="226" width="67.2" height="28" rx="8" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/><text x="61.6" y="245" text-anchor="middle" class="m" font-size="12" fill="#e6edf7">Python</text></g>
<g class="pop" style="animation-delay:1.5s"><rect x="103.2" y="226" width="52.8" height="28" rx="8" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/><text x="129.6" y="245" text-anchor="middle" class="m" font-size="12" fill="#e6edf7">YOLO</text></g>
<g class="pop" style="animation-delay:1.6s"><rect x="164" y="226" width="139.2" height="28" rx="8" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/><text x="233.6" y="245" text-anchor="middle" class="m" font-size="12" fill="#e6edf7">Face Recognition</text></g>
<g class="pop" style="animation-delay:1.7s"><rect x="311.2" y="226" width="38.4" height="28" rx="8" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/><text x="330.4" y="245" text-anchor="middle" class="m" font-size="12" fill="#e6edf7">JS</text></g>
<text x="492" y="245" text-anchor="end" class="m in" font-size="12" letter-spacing="2" fill="#a78bfa" style="animation-delay:1.8s">VIEW ↗</text>
