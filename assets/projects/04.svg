<g class="pop" style="animation-delay:1.5s"><rect x="132" y="226" width="67.2" height="28" rx="8" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".35"/><text x="165.6" y="245" text-anchor="middle" class="m" font-size="12" fill="#e6edf7">Ollama</text></g>
