<style>.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif}@keyframes in{from{opacity:0;transform:translateY(10px)}}.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes run{to{stroke-dashoffset:-1000}}.run{animation:run 8s linear infinite}@keyframes rev{from{transform:translateX(0)}}.tw{animation-name:rev;animation-fill-mode:both}@keyframes odo{from{transform:translateY(0)}}.odo{animation:odo 1.8s cubic-bezier(.15,.85,.25,1) both}@keyframes grow{from{transform:scaleX(0)}}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.2)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.3,1.4) both}@keyframes draw{from{stroke-dashoffset:1000}}.draw{stroke-dasharray:1000;animation:draw 2.4s ease-out both}@keyframes fade{from{opacity:0}}.fade{animation:fade 1s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
