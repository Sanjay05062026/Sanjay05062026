<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient><clipPath id="t1"><rect class="tw" x="13.6" y="32.2" width="32.4" height="28.8" style="transform:translateX(32.4px);animation-duration:0.1s;animation-delay:0.1s;animation-timing-function:steps(3,end)"/></clipPath><clipPath id="t2"><rect class="tw" x="-162.8" y="25.4" width="254.8" height="41.6" style="transform:translateX(254.8px);animation-duration:0.34s;animation-delay:0.25s;animation-timing-function:steps(13,end)"/></clipPath><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="367.2" y1="0" x2="1026.8" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient><clipPath id="t3"><rect class="tw" x="933.8" y="33.7" width="117" height="20.8" style="transform:translateX(117px);animation-duration:0.21s;animation-delay:0.74s;animation-timing-function:steps(15,end)"/></clipPath></defs>
<style>.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace}.s{font-family:'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif}@keyframes in{from{opacity:0;transform:translateY(10px)}}.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes run{to{stroke-dashoffset:-1000}}.run{animation:run 8s linear infinite}@keyframes rev{from{transform:translateX(0)}}.tw{animation-name:rev;animation-fill-mode:both}@keyframes odo{from{transform:translateY(0)}}.odo{animation:odo 1.8s cubic-bezier(.15,.85,.25,1) both}@keyframes grow{from{transform:scaleX(0)}}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:scale(.2)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.3,1.4) both}@keyframes draw{from{stroke-dashoffset:1000}}.draw{stroke-dasharray:1000;animation:draw 2.4s ease-out both}@keyframes fade{from{opacity:0}}.fade{animation:fade 1s ease-out both}@keyframes trav{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}.trav{animation:trav 3.6s cubic-bezier(.6,0,.4,1) 2s infinite;opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
